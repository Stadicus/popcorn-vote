name: Release

# Releases are started explicitly from the Actions UI. They publish the current
# tip of main to the GitHub Container Registry, tagged with the version from
# package.json and with latest:
#   ghcr.io/<owner>/<repo>:<version> and :latest
#
# The build is laid out for several architectures: each is produced on its own
# and without a tag, then they are united into a manifest list from which any
# container service picks the matching architecture.
#
# If the version is new, the same manually started run also creates the git tag
# `v<version>` and the GitHub release, using the matching CHANGELOG section.
on:
  workflow_dispatch:

# Two runs in a row must not overtake each other: otherwise the faster one would
# create tag and release on its commit while the other built the image.
concurrency:
  group: release-manual
  cancel-in-progress: false

jobs:
  gate:
    name: Confirm CI gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.target.outputs.release_sha }}
      publish: ${{ steps.target.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_sha=$(git rev-parse HEAD)
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$release_sha" != "$main_sha" ]; then
            echo "::error::$release_sha was checked out, but main is now $main_sha. Start the release again."
            exit 1
          fi

          # A manual click chooses when to publish, but it cannot bypass the
          # quality gates for the exact commit being released.
          deadline=$((SECONDS + 1800))
          for workflow in ci.yml security.yml codeql.yml; do
            while true; do
              line=$(
                gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=push&branch=main&head_sha=$release_sha&per_page=1" \
                  --jq '.workflow_runs[] | [.status, (.conclusion // "")] | @tsv' |
                  head -n 1
              )
              if [ -n "$line" ]; then
                read -r status conclusion <<< "$line"
                if [ "$status" = completed ]; then
                  if [ "$conclusion" != success ]; then
                    echo "::error::$workflow finished with conclusion '$conclusion'; release is blocked."
                    exit 1
                  fi
                  break
                fi
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::Timed out waiting for $workflow to pass for $release_sha."
                exit 1
              fi
              sleep 20
            done
          done

          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$release_sha" != "$main_sha" ]; then
            echo "::error::main moved from $release_sha to $main_sha while checking the gates. Start the release again."
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  # Before building, not after: a version bump without a CHANGELOG section should
  # prevent publication. If the check ran afterwards, `:latest` would already be in
  # the registry and installations tracking it would pull it . on a run coloured
  # red that one takes for harmless.
  notes:
    name: Check version and release notes
    if: needs.gate.outputs.publish == 'true'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_new: ${{ steps.notes.outputs.version_new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          # A line of its own with a check: inside a command substitution within
          # `echo` the shell swallows every error, and a broken package.json would
          # quietly produce an image tagged "undefined".
          version=$(node -p "require('./package.json').version")
          case "$version" in
            '' | undefined | null)
              echo "::error file=package.json::No usable version found."
              exit 1
              ;;
            # Anything that is not a valid Docker tag. A newline would break out
            # of GITHUB_OUTPUT and truncate the image tag silently; `+` is allowed
            # in npm versions but not in Docker tags, and would only die deep
            # inside the build.
            *[!0-9A-Za-z._-]* | [!0-9A-Za-z]*)
              echo "::error file=package.json::Version \"$version\" is not usable as a Docker tag."
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the notes when the version is new
        # Merges without a version bump land on main too. For those the tag
        # already exists, and only `:latest` is refreshed. A new version still
        # needs release notes before anything is published under that tag.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        id: notes
        run: |
          set -euo pipefail
          # `matching-refs` answers with an empty list rather than a 404 when the
          # tag does not exist. That way an API outage aborts the run instead of
          # passing itself off as "tag missing" and starting a release that then
          # fails with a 422.
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" --jq '.[].ref')
          while IFS= read -r ref; do
            if [ "$ref" = "refs/tags/v$VERSION" ]; then
              echo "v$VERSION is already published. This run brings no new version."
              echo "version_new=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$refs"
          if ! .github/release-notes.sh "$VERSION" > /dev/null; then
            echo "::error file=CHANGELOG.md::Version $VERSION is new but has no release notes. Without notes nothing is published."
            exit 1
          fi
          echo "v$VERSION is new and has notes."
          echo "version_new=true" >> "$GITHUB_OUTPUT"
      - name: Require post-release store PR credentials for a new version
        if: steps.notes.outputs.version_new == 'true'
        shell: bash
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [ -z "$RELEASE_PR_TOKEN" ]; then
            echo "::error::RELEASE_PR_TOKEN is required so a new release can open its Umbrel/CasaOS update PR and trigger the protected PR checks."
            exit 1
          fi

  # One architecture per runner, each native rather than emulated: better-sqlite3
  # is compiled from source on Alpine (musl), which takes a multiple of the time
  # under QEMU. The partial images carry no tag yet . a tag from one runner would
  # overwrite the other's instead of complementing it. It is only assigned when
  # they are merged.
  #
  # Native GitHub-hosted runners build both supported architectures. Keeping them
  # separate avoids emulation and lets the manifest job publish one image for all
  # devices.
  build:
    name: Build image (${{ matrix.platform }})
    if: needs.gate.outputs.publish == 'true'
    needs: [gate, notes]
    runs-on: ${{ matrix.runner }}
    outputs:
      # How many partial images the merge should expect. Read from the matrix
      # itself, so that the two places cannot drift apart once an architecture
      # is added here. That several runs of a matrix job share one output is
      # harmless here: `job-total` is the same value for each of them, unlike,
      # say, a digest.
      expected: ${{ strategy.job-total }}
    strategy:
      # Build every architecture to the end rather than choking off the rest on
      # the first failure: that way all errors are visible at once. Nothing is
      # published regardless . the next job demands all of them. A partial image
      # already uploaded then sits untagged in the registry; that is the price,
      # and it bothers nobody, because untagged layers are downloaded by no one.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            hass_arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            hass_arch: aarch64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
      - id: target
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          build-args: |
            GITHUB_SHA=${{ needs.gate.outputs.release_sha }}
            BUILD_VERSION=${{ needs.notes.outputs.version }}
            BUILD_ARCH=${{ matrix.hass_arch }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.target.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Provenance and bill of materials: they answer, for outsiders, which
          # commit this image came from and what is inside it.
          provenance: mode=max
          sbom: true
          # Separate caches, or the architectures overwrite each other and neither
          # of them ever gets a hit.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Store the digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ steps.target.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          # Artefacts outlive the individual attempt. Without this, the very
          # retry a failure here triggers would break off . with "already
          # exists", not with the actual error.
          overwrite: true

  image:
    name: Publish image to GHCR
    if: needs.gate.outputs.publish == 'true'
    # Every architecture from the matrix has to be in place: if one fails, this job
    # does not start at all, and the registry keeps what it had.
    needs: [gate, notes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      manifest_digest: ${{ steps.inspect.outputs.manifest_digest }}
    steps:
      # No checkout: since the build sits next door, no step here touches a file
      # from the tree any more.
      - id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          # Only what really is the tip of main gets `:latest`.
          #
          # Main can move after the manual run passed its gate. Check once more
          # before assigning the moving tag.
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head_sha" = "$RELEASE_SHA" ]; then
            echo "publish_candidate=true" >> "$GITHUB_OUTPUT"
            echo "latest=$image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$RELEASE_SHA is not the tip of main ($head_sha). Image publication is superseded."
            echo "publish_candidate=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.target.outputs.publish_candidate == 'true'
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        if: steps.target.outputs.publish_candidate == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: steps.target.outputs.publish_candidate == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Unite the architectures under one tag
        id: publish
        if: steps.target.outputs.publish_candidate == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.target.outputs.image }}
          RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
          VERSION: ${{ needs.notes.outputs.version }}
          VERSION_NEW: ${{ needs.notes.outputs.version_new }}
          EXPECTED: ${{ needs.build.outputs.expected }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head_sha" != "$RELEASE_SHA" ]; then
            echo "::notice::$RELEASE_SHA is no longer the tip of main ($head_sha). No image tags are published."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # File names become references. Through an array rather than word
          # splitting of a string: an empty directory would otherwise yield the
          # unchanged asterisk, and `imagetools create` would be handed it as a
          # reference.
          digest_refs=()
          for digest in *; do digest_refs+=("$IMAGE@sha256:$digest"); done

          # One digest per architecture built. If one is missing, the manifest
          # list would look healthy but would strand every device of the missing
          # architecture . better to publish nothing at all.
          if [ "${#digest_refs[@]}" -ne "$EXPECTED" ]; then
            echo "::error::${#digest_refs[@]} digests found, $EXPECTED expected."
            exit 1
          fi

          # A version tag is immutable in practice: once the git tag/release
          # exists, a later main commit with the same package.json version must
          # not move the matching image tag. Such commits update only `:latest`.
          tags=()
          if [ "$VERSION_NEW" = true ]; then
            set +e
            inspect_output=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)
            inspect_status=$?
            set -e
            if [ "$inspect_status" -eq 0 ]; then
              echo "::error::$IMAGE:$VERSION already exists, but v$VERSION does not. Refusing to overwrite the orphaned registry tag."
              exit 1
            fi
            if ! grep -Eiq "(not found|manifest unknown|no such manifest)" <<< "$inspect_output"; then
              echo "::error::Could not verify that $IMAGE:$VERSION is absent."
              printf '%s\n' "$inspect_output"
              exit 1
            fi
            tags+=(--tag "$IMAGE:$VERSION")
          fi
          tags+=(--tag "$IMAGE:latest")

          docker buildx imagetools create "${tags[@]}" "${digest_refs[@]}"
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Inspect the result and record release metadata
        id: inspect
        if: steps.publish.outputs.published == 'true'
        # Publication above is the point of no return for the immutable version
        # tag. A transient registry read or summary-write failure must not
        # suppress the matching GitHub release and strand that tag. Retries
        # still make this useful as the normal post-publication verification.
        continue-on-error: true
        shell: bash
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
          VERSION: ${{ needs.notes.outputs.version }}
          VERSION_NEW: ${{ needs.notes.outputs.version_new }}
        run: |
          set -euo pipefail
          if [ "$VERSION_NEW" = true ]; then
            reference="$IMAGE:$VERSION"
          else
            reference="$IMAGE:latest"
          fi

          inspection=
          for attempt in 1 2 3 4 5; do
            if inspection=$(docker buildx imagetools inspect "$reference"); then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Could not inspect $reference after $attempt attempts."
              exit 1
            fi
            sleep 5
          done
          printf '%s\n' "$inspection"
          digest=$(awk "/^Digest:[[:space:]]+sha256:/{print \$2; exit}" <<< "$inspection")
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the manifest-list digest from $reference."
            exit 1
          fi

          echo "manifest_digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo '## Published container manifest'
            echo
            echo "- Tag: \`$reference\`"
            echo "- Manifest digest: \`$digest\`"
            echo "- Immutable reference: \`$IMAGE@$digest\`"
            echo "- Source commit: \`$RELEASE_SHA\`"
            echo
            echo "A following best-effort step stores the same digest in the \`release-metadata\` workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create machine-readable release metadata
        id: metadata
        if: steps.publish.outputs.published == 'true' && steps.inspect.outcome == 'success'
        # Convenience output only: a JSON-generation failure after publication
        # must not orphan the tag.
        continue-on-error: true
        shell: bash
        env:
          DIGEST: ${{ steps.inspect.outputs.manifest_digest }}
          IMAGE: ${{ steps.target.outputs.image }}
          RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
          VERSION: ${{ needs.notes.outputs.version }}
          VERSION_NEW: ${{ needs.notes.outputs.version_new }}
        run: |
          set -euo pipefail
          if [ "$VERSION_NEW" = true ]; then
            reference="$IMAGE:$VERSION"
          else
            reference="$IMAGE:latest"
          fi
          metadata="$RUNNER_TEMP/release-metadata.json"
          metadata_filter="{version: \$version, version_new: \$version_new, image: \$image, tag: \$tag, digest: \$digest, immutable_reference: \$immutable_reference, release_sha: \$release_sha}"
          jq -n \
            --arg version "$VERSION" \
            --argjson version_new "$VERSION_NEW" \
            --arg image "$IMAGE" \
            --arg tag "$reference" \
            --arg digest "$DIGEST" \
            --arg immutable_reference "$IMAGE@$DIGEST" \
            --arg release_sha "$RELEASE_SHA" \
            "$metadata_filter" \
            > "$metadata"
          echo "metadata_path=$metadata" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.publish.outputs.published == 'true' && steps.metadata.outcome == 'success'
        # The immutable image tag already exists at this point. A transient
        # artifact-service failure must not suppress the matching GitHub release
        # and leave an orphan tag that the next run correctly refuses to move.
        continue-on-error: true
        with:
          name: release-metadata-${{ needs.notes.outputs.version }}
          path: ${{ steps.metadata.outputs.metadata_path }}
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  release:
    name: Publish tag and release
    # Only new versions get a GitHub release. Ordinary main commits with the same
    # package.json version may refresh `:latest`, but they must not move the
    # already published version tag.
    if: needs.gate.outputs.publish == 'true' && needs.notes.outputs.version_new == 'true' && needs.image.outputs.published == 'true'
    # Only once the image is in place: a release whose image is missing sends
    # every reader nowhere.
    needs: [gate, notes, image]
    runs-on: ubuntu-latest
    permissions:
      # Its own permissions, its own job: the build still gets by with read access.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
      - name: Create tag and release when the version is new
        # bash explicitly: the title below is built with pattern substitution, and
        # every shell spells that differently.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.notes.outputs.version }}
          RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"

          # Merges without a version bump land on main too. For those the tag
          # already exists, and then there is nothing to do here. Through
          # matching-refs as in the check job, so that an API outage aborts rather
          # than guesses.
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref')
          while IFS= read -r ref; do
            if [ "$ref" = "refs/tags/$tag" ]; then
              echo "$tag is already published. No new release."
              exit 0
            fi
          done <<< "$refs"

          # In the runner's working directory, not in the checked-out tree: that
          # way no later step can pick the file up by accident.
          notes="$RUNNER_TEMP/notes.md"
          .github/release-notes.sh "$VERSION" > "$notes"

          gh release create "$tag" \
            --target "${{ needs.gate.outputs.release_sha }}" \
            --title "$tag" \
            --notes-file "$notes"

  store-metadata:
    name: Open Umbrel and CasaOS update PR
    if: needs.gate.outputs.publish == 'true' && needs.notes.outputs.version_new == 'true' && needs.image.outputs.published == 'true'
    needs: [gate, notes, image, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
          # The persisted GITHUB_TOKEN is read-only here and would override the
          # PAT used below. It would also suppress follow-up CI if permissions
          # were widened, so leave Git authentication to RELEASE_PR_TOKEN.
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Resolve the published manifest digest
        id: digest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.notes.outputs.version }}
          RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
          PUBLISHED_DIGEST: ${{ needs.image.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          digest=$PUBLISHED_DIGEST
          if [ -z "$digest" ]; then
            for attempt in 1 2 3 4 5; do
              inspection=$(docker buildx imagetools inspect "${IMAGE,,}:$VERSION" 2>/dev/null || true)
              digest=$(awk '/^Digest:[[:space:]]+sha256:/{print $2; exit}' <<< "$inspection")
              [ -n "$digest" ] && break
              [ "$attempt" -eq 5 ] || sleep 5
            done
          fi
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve the published manifest digest for v$VERSION."
            exit 1
          fi
          release=$(gh release view "v$VERSION" --json publishedAt,targetCommitish)
          release_target=$(jq -r .targetCommitish <<< "$release")
          release_date=$(jq -r '.publishedAt[0:10]' <<< "$release")
          if [ "$release_target" != "$RELEASE_SHA" ] || [[ ! $release_date =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::The published release metadata does not match source commit $RELEASE_SHA."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
      - name: Materialize the published store metadata
        env:
          VERSION: ${{ needs.notes.outputs.version }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          RELEASE_DATE: ${{ steps.digest.outputs.release_date }}
        run: bash packaging/prepare-store-update.sh "$VERSION" "$DIGEST"
      - name: Commit, push, and open the protected update PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          VERSION: ${{ needs.notes.outputs.version }}
          RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          branch="release/store-metadata-v$VERSION"
          files=(
            packaging/casaos/docker-compose.yml
            packaging/required-packages.txt
            packaging/umbrel/docker-compose.yml
            packaging/umbrel/umbrel-app.yml
          )

          body="$RUNNER_TEMP/store-pr.md"
          {
            printf '%s\n' \
              '## What changed' \
              '' \
              "- update Umbrel to v$VERSION and pin the published multi-architecture manifest" \
              "- materialize the CasaOS v$VERSION direct-import package" \
              '' \
              '## Published artifact' \
              ''
            printf -- '- Source commit: <code>%s</code>\n' "$RELEASE_SHA"
            printf -- '- Manifest digest: <code>%s</code>\n' "$DIGEST"
            printf '%s\n' \
              '' \
              'Home Assistant remains gated on a real Home Assistant OS device acceptance test.'
          } > "$body"

          gh auth setup-git
          if gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$branch" --jq '.[].ref' | grep -qx "refs/heads/$branch"; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git diff --quiet "origin/$branch" -- "${files[@]}"; then
              echo "::error::$branch already exists with different store metadata. Refusing to overwrite it."
              exit 1
            fi
            existing_pr=$(gh pr list --state all --head "$branch" --json mergedAt,state,url --jq '.[0] // empty')
            if [ -n "$existing_pr" ]; then
              existing_url=$(jq -r .url <<< "$existing_pr")
              existing_state=$(jq -r .state <<< "$existing_pr")
              existing_merged=$(jq -r .mergedAt <<< "$existing_pr")
              if [ "$existing_state" = OPEN ] || [ "$existing_merged" != null ]; then
                echo "Store metadata PR already exists: $existing_url"
                exit 0
              fi
              echo "::error::Store metadata PR $existing_url was closed without merging. Reopen it or remove $branch before retrying."
              exit 1
            fi
            gh pr create \
              --base main \
              --head "$branch" \
              --draft \
              --title "Update Umbrel and CasaOS to v$VERSION" \
              --body-file "$body"
            exit 0
          fi

          git switch -c "$branch"
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "::error::The release produced no store metadata changes."
            exit 1
          fi
          git commit -m "chore(packaging): update stores to v$VERSION"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --draft \
            --title "Update Umbrel and CasaOS to v$VERSION" \
            --body-file "$body"
